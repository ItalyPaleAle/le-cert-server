# Generated by vercel-docs-build from config.json — do not edit by hand.
baseURL = "https://le-cert-server.italypaleale.me/"
locale = "en-us"
title = "le-cert-server"
disableKinds = ["rss"]
enableRobotsTXT = true

[module]
  [module.hugoVersion]
    extended = true
    min = '0.164.0'
  [[module.imports]]
    path = "github.com/italypaleale/hugo-assets"

# Required for render hooks + unsafe HTML in markdown
[markup]
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false
    lineNumbersInTable = false
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "Secure, centralized Let's Encrypt certificate management for multiple servers and distributed systems"
  github_url = "https://github.com/italypaleale/le-cert-server"
  github_repo = "https://github.com/italypaleale/le-cert-server"
  github_branch = "main"
  github_path = "docs"
  PlausibleAnalytics = true

  [params.robots]
    llmsTXT = true

  [params.theme]
    scheme = "indigo"

# Taxonomy pages aren't needed for a docs site
[taxonomies]

# Output HTML and Markdown for AI agents
[outputs]
  home    = ["html", "markdown"]
  section = ["html", "markdown"]
  page    = ["html", "markdown"]
